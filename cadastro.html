<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Conta | Chronos Acadêmico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="register">

  <main class="auth-layout centered">
    <section class="glass-card auth-card stack">
      <div class="brand-pill">
        <span class="status-dot"></span>
        <i class="ph-fill ph-student"></i>
        <span>CADASTRO RÁPIDO</span>
      </div>

      <h1 class="balance">Configure a meta da sua faculdade.</h1>
      <p class="pretty">
        Informe seu curso e quantas horas complementares sua faculdade exige para se formar.
      </p>

      <div id="auth-alert" class="alert-box" hidden></div>

      <form id="register-form" class="stack" style="width: 100%; text-align: left;">
        <div class="field">
          <label for="reg-course" class="field__label">Seu Curso e Faculdade</label>
          <input type="text" id="reg-course" class="field__input" placeholder="Ex: Administração - UFSJ" required />
        </div>

        <div class="field">
          <label for="reg-quota" class="field__label">Cota de Horas Exigida pela Faculdade</label>
          <input type="number" id="reg-quota" class="field__input mono-text" min="10" max="5000" value="200" required />
        </div>

        <button type="submit" class="btn btn--google" style="margin-top: 8px;">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20" alt="Google" />
          <span>Concluir Cadastro com Google</span>
        </button>
      </form>

      <div class="auth-divider">
        <span>Já tem conta?</span>
      </div>

      <a href="login.html" class="btn btn--ghost" style="width: 100%;">
        <i class="ph ph-sign-in"></i>
        <span>Já tenho conta, fazer login</span>
      </a>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
